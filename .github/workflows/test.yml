name: Canvas 0.1 witness

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone-grounded-field:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run standalone tests
        run: python -m unittest -v tests.test_canvas01
      - name: Validate fixture
        run: python canvas01.py validate fixtures/grounded-field.canvas.json
      - name: Resolve grounding path
        run: python canvas01.py ground-path fixtures/grounded-field.canvas.json object-note --root .

  canvas-self-field:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run repository, card, and field-design tests
        run: python -m unittest -v tests.test_repo_canvas tests.test_field_view
      - name: Project this exact Canvas revision into the Canvas field
        run: |
          mkdir -p artifacts
          python repo_canvas.py project . \
            --source-id bdf1992/Canvas \
            --output artifacts/canvas.canvas.json \
            | tee artifacts/summary.json
      - name: Render with the Canvas interaction design system
        run: python field_view.py artifacts/canvas.canvas.json . --output artifacts/canvas.html
      - name: Validate portable Canvas contract
        run: python canvas01.py validate artifacts/canvas.canvas.json
      - name: Resolve every projected Canvas Git object
        run: |
          python repo_canvas.py verify artifacts/canvas.canvas.json . \
            --source-id bdf1992/Canvas
      - name: Prove deterministic same-revision projection
        run: |
          python repo_canvas.py project . \
            --source-id bdf1992/Canvas \
            --output artifacts/canvas-second.canvas.json >/dev/null
          cmp artifacts/canvas.canvas.json artifacts/canvas-second.canvas.json
          rm artifacts/canvas-second.canvas.json
      - name: Publish primary self-hosted Canvas field witness
        uses: actions/upload-artifact@v4
        with:
          name: canvas-self-field
          path: artifacts/
          if-no-files-found: error
