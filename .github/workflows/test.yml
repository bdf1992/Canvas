name: Canvas 0.1 witness

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone-grounded-field:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run standalone tests
        run: python -m unittest -v tests.test_canvas01
      - name: Validate fixture
        run: python canvas01.py validate fixtures/grounded-field.canvas.json
      - name: Resolve grounding path
        run: python canvas01.py ground-path fixtures/grounded-field.canvas.json object-note --root .

  canvas-first-board:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run repository, Card, and generic Board tests
        run: python -m unittest -v tests.test_repo_canvas tests.test_field_view tests.test_board_view
      - name: Project this exact Canvas revision into the repository field
        run: |
          mkdir -p artifacts
          python repo_canvas.py project . \
            --source-id bdf1992/Canvas \
            --output artifacts/canvas.field.json \
            | tee artifacts/field-summary.json
      - name: Author first Board from Cards and contains relations
        run: |
          python board_view.py build artifacts/canvas.field.json \
            --board-id repository-containment \
            --label "Directory Board" \
            --premise "What exists here, and how is it contained?" \
            --relation contains \
            --repo . \
            --output artifacts/board.canvas.json \
            --html artifacts/board.html \
            | tee artifacts/board-summary.json
      - name: Validate portable Board contract
        run: python canvas01.py validate artifacts/board.canvas.json
      - name: Resolve every grounded Card Object on the Board
        run: |
          python repo_canvas.py verify artifacts/board.canvas.json . \
            --source-id bdf1992/Canvas
      - name: Prove deterministic field and Board composition
        run: |
          python repo_canvas.py project . \
            --source-id bdf1992/Canvas \
            --output artifacts/canvas-second.field.json >/dev/null
          cmp artifacts/canvas.field.json artifacts/canvas-second.field.json
          python board_view.py build artifacts/canvas-second.field.json \
            --board-id repository-containment \
            --label "Directory Board" \
            --premise "What exists here, and how is it contained?" \
            --relation contains \
            --output artifacts/board-second.canvas.json >/dev/null
          cmp artifacts/board.canvas.json artifacts/board-second.canvas.json
          rm artifacts/canvas-second.field.json artifacts/board-second.canvas.json
      - name: Publish primary self-hosted Board witness
        uses: actions/upload-artifact@v4
        with:
          name: canvas-first-board
          path: artifacts/
          if-no-files-found: error
