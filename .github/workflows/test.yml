name: Canvas 0.1 witness

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone-grounded-field:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run standalone tests
        run: python -m unittest -v tests.test_canvas01
      - name: Validate fixture
        run: python canvas01.py validate fixtures/grounded-field.canvas.json
      - name: Resolve grounding path
        run: python canvas01.py ground-path fixtures/grounded-field.canvas.json object-note --root .

  canvas-directory-board:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run repository, Card capability, and Directory Board tests
        run: python -m unittest -v tests.test_repo_canvas tests.test_field_view tests.test_directory_board
      - name: Project this exact Canvas revision into the repository field
        run: |
          mkdir -p artifacts
          python repo_canvas.py project . \
            --source-id bdf1992/Canvas \
            --output artifacts/canvas.field.json \
            | tee artifacts/field-summary.json
      - name: Derive and render the first premise-bearing Directory Board
        run: |
          python directory_board.py build artifacts/canvas.field.json \
            --output artifacts/directory-board.canvas.json \
            --html artifacts/directory-board.html \
            | tee artifacts/board-summary.json
      - name: Validate portable Directory Board contract
        run: python canvas01.py validate artifacts/directory-board.canvas.json
      - name: Resolve every grounded repository Object on the Board
        run: |
          python repo_canvas.py verify artifacts/directory-board.canvas.json . \
            --source-id bdf1992/Canvas
      - name: Prove deterministic field and Board derivation
        run: |
          python repo_canvas.py project . \
            --source-id bdf1992/Canvas \
            --output artifacts/canvas-second.field.json >/dev/null
          cmp artifacts/canvas.field.json artifacts/canvas-second.field.json
          python directory_board.py build artifacts/canvas-second.field.json \
            --output artifacts/directory-board-second.canvas.json >/dev/null
          cmp artifacts/directory-board.canvas.json artifacts/directory-board-second.canvas.json
          rm artifacts/canvas-second.field.json artifacts/directory-board-second.canvas.json
      - name: Publish primary self-hosted Directory Board witness
        uses: actions/upload-artifact@v4
        with:
          name: canvas-directory-board
          path: artifacts/
          if-no-files-found: error
