name: Canvas 0.1 witness

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone-grounded-field:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run standalone tests
        run: python -m unittest -v tests.test_canvas01
      - name: Validate fixture
        run: python canvas01.py validate fixtures/grounded-field.canvas.json
      - name: Resolve grounding path
        run: python canvas01.py ground-path fixtures/grounded-field.canvas.json object-note --root .

  repository-board:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run repository projection tests
        run: python -m unittest -v tests.test_repo_canvas
      - name: Clone the first real source repository
        run: git clone --depth=1 --no-tags https://github.com/bdf1992/Soveraeign.git /tmp/Soveraeign
      - name: Project complete Soveraeign HEAD into Canvas
        run: |
          mkdir -p artifacts
          python repo_canvas.py project /tmp/Soveraeign \
            --source-id bdf1992/Soveraeign \
            --output artifacts/soveraeign.canvas.json \
            --html artifacts/soveraeign-board.html \
            | tee artifacts/summary.json
      - name: Validate portable Canvas contract
        run: python canvas01.py validate artifacts/soveraeign.canvas.json
      - name: Resolve every projected Git object
        run: |
          python repo_canvas.py verify artifacts/soveraeign.canvas.json /tmp/Soveraeign \
            --source-id bdf1992/Soveraeign
      - name: Prove deterministic same-revision projection
        run: |
          python repo_canvas.py project /tmp/Soveraeign \
            --source-id bdf1992/Soveraeign \
            --output artifacts/soveraeign-second.canvas.json >/dev/null
          cmp artifacts/soveraeign.canvas.json artifacts/soveraeign-second.canvas.json
          rm artifacts/soveraeign-second.canvas.json
      - name: Publish shared board witness
        uses: actions/upload-artifact@v4
        with:
          name: soveraeign-canvas-board
          path: artifacts/
          if-no-files-found: error
